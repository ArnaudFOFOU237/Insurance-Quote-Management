services:
  db:
    image: mariadb:10.11
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - 3306:3306
    volumes:
      - dbdata:/var/lib/mysql
  phpmyadmin:
    image: phpmyadmin
    restart: always
    ports:
      - 8080:80
    environment:
      - PMA_ARBITRARY=1
  quote-service:
    image: quote-app-image
    ports:
      - "8081:8081" # Port hôte : Port conteneur
    environment:
      - SERVER_PORT=8081
volumes:
  dbdata: