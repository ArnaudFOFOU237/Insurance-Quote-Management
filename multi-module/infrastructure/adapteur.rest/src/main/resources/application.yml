spring:
  application:
    name: quote
  cache:
    type: redis
  data:
    redis:
      host: localhost
      port: 6379
  datasource:
    url: jdbc:mysql://localhost:3306/quotedb?createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enable: true
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/real-demo
          jwk-set-uri: http://localhost:9090/realms/real-demo/protocol/openid-connect/certs
server:
  port: 8081

external:
  api:
    url: http://localhost:8080

jwt:
  auth:
    converter:
      resource-id: my-app-client
      principal-attribute: principal_username