spring:
  application:
    name: quote
  datasource:
    url: jdbc:mysql://localhost:3306/quotedb?createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enable: true
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
server:
  port: 8081

external:
  api:
    url: http://localhost:8080

